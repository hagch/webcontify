openapi: 3.1.0
info:
  title: Webcontify Health API
  version: 1.0.0
  description: Health check endpoint for pipeline testing

servers:
  - url: /api/v1

tags:
  - name: Health
    description: Health Check

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: './common-schemas.yaml#/components/schemas/ProblemDetail'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: UP
