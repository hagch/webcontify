spring:
  application:
    name: webcontify-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.localhost/realms/webcontify-platform}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080

webcontify:
  encryption:
    key: ${ENCRYPTION_KEY:}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}