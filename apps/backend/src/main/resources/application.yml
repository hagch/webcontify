spring:
  application:
    name: webcontify-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080

keycloak:
  admin:
    server-url: http://auth.localhost
    client-id: platform-backend
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:platform-backend-secret}
    realm: webcontify-platform

webcontify:
  encryption:
    key: ${ENCRYPTION_KEY:}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

openfga:
  api-url: ${OPENFGA_API_URL:http://localhost:8082}
  authorization-model-path: classpath:openfga/model.json

platform:
  smtp:
    host: ${PLATFORM_SMTP_HOST:mailpit}
    port: ${PLATFORM_SMTP_PORT:1025}
    from: ${PLATFORM_SMTP_FROM:noreply@webcontify.io}
    username: ${PLATFORM_SMTP_USER:}
    password: ${PLATFORM_SMTP_PASSWORD:}
    starttls: ${PLATFORM_SMTP_STARTTLS:false}