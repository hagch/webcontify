http:
  routers:
    platform:
      rule: "Host(`platform.localhost`)"
      service: platform
      priority: 10
      entryPoints:
        - web
    tenant-wildcard:
      rule: "HostRegexp(`^[a-z0-9-]+\\.localhost$`)"
      service: platform
      priority: 1
      entryPoints:
        - web
    api:
      rule: "Host(`api.localhost`)"
      service: api
      entryPoints:
        - web
    s3-api:
      rule: "Host(`s3-api.localhost`)"
      service: s3-api
      priority: 10
      entryPoints:
        - web

  services:
    platform:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
    api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"
    s3-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9000"
